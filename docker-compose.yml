services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "7860:7860"
    volumes:
      - ./demo:/app/demo
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - PYTHONUNBUFFERED=1
      - HF_TOKEN=${HF_TOKEN:-}
      - NVIDIA_VISIBLE_DEVICES=4
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['4']
              capabilities: [gpu]
    stop_grace_period: 5s
