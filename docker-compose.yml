services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "7861:7861"
    volumes:
      - ./gryannote/audio/frontend/interactive:/app/gryannote/audio/frontend/interactive
      - ./gryannote/audio/frontend/player:/app/gryannote/audio/frontend/player
      - ./gryannote/audio/frontend/recorder:/app/gryannote/audio/frontend/recorder
      - ./gryannote/audio/frontend/shared:/app/gryannote/audio/frontend/shared
      - ./gryannote/audio/frontend/static:/app/gryannote/audio/frontend/static
      - ./gryannote/audio/frontend/streaming:/app/gryannote/audio/frontend/streaming
      - ./gryannote/audio/frontend/Index.svelte:/app/gryannote/audio/frontend/Index.svelte
      - ./gryannote/audio/frontend/Example.svelte:/app/gryannote/audio/frontend/Example.svelte
      - ./gryannote/audio/frontend/index.ts:/app/gryannote/audio/frontend/index.ts
      - ./gryannote/audio/backend:/app/gryannote/audio/backend
      - ./gryannote/audio/demo:/app/gryannote/audio/demo
    working_dir: /app/gryannote/audio
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - HF_TOKEN=${HF_TOKEN:-}

  demo:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "7860:7860"
    volumes:
      - ./demo:/app/demo
      - ./gryannote:/app/gryannote
    working_dir: /app
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - HF_TOKEN=${HF_TOKEN:-}
    entrypoint: ["python"]
    command: ["demo/app.py"]
